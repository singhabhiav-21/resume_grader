name: ci/cd
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
  runs-on: ubuntu-latest
  services:
    postgres:
      image: postgres:15
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: resume_db_test
      ports:
        - 5432:5432
      options: >-
        --health-cmd="pg_isready -U postgres"
        --health-timeout=5s
        --health-interval=5s
        --health-retries=5
