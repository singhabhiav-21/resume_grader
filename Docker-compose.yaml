
services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}§
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - JWT_KEY=${JWT_KEY}
      - JWT_ALG=${JWT_ALG}
      - FILE_PATH=/backend/app/disk_stor/
      - CHROMA_PATH=/backend/app/chroma_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
    volumes:
      - ./app:/backend/app
      - ./alembic:/backend/alembic
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:
